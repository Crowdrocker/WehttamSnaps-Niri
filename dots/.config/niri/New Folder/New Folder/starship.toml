# ~/.config/starship.toml
# WehttamSnaps Cyberpunk Starship Configuration

format = """
[╭─](bold cyan)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nix_shell\
$python\
$rust\
$nodejs\
$cmd_duration\
$line_break\
[╰─](bold cyan)$character"""

# Prompt character
[character]
success_symbol = "[➜](bold cyan)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[V](bold green)"

# Username
[username]
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)"
disabled = false
show_always = true

# Hostname
[hostname]
ssh_only = false
format = "[@$hostname](bold magenta) "
disabled = false

# Directory
[directory]
style = "bold yellow"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/Documents" = " 󰈙 "
"~/Downloads" = "  "
"~/Music" = "  "
"~/Pictures" = "  "
"~/Videos" = "  "
"~/.config" = "  "
"~/Games" = " 󰊗 "

# Git branch
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Git status
[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Command duration
[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[⏱ $duration]($style) "

# Nix shell
[nix_shell]
symbol = " "
format = '[$symbol$state]($style) '
style = "bold blue"

# Python
[python]
symbol = " "
style = "bold green"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

# Rust
[rust]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

# Node.js
[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

# Line break
[line_break]
disabled = false

# Status
[status]
style = "bold red"
symbol = "✖"
success_symbol = "✔"
format = '[\[$symbol $status\]]($style) '
disabled = false
